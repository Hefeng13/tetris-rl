[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-rl-course"
version = "0.1.0"
description = "Reproducible Tetris placement-learning course project"
requires-python = ">=3.10"
dependencies = ["tetris-gymnasium==0.3.1", "torch>=2.6", "numpy>=2", "PyYAML>=6", "matplotlib>=3.9", "pillow>=11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
